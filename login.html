<!-- login.html -->
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>تسجيل الدخول</title>
  <link rel="stylesheet" href="assets/style.css">
</head>
<body class="centered gradient">
  <div class="form-container">
    <h2>تسجيل الدخول</h2>
    <form id="loginForm">
      <input placeholder="رقم الهاتف أو الإيميل" required>
      <input type="password" placeholder="كلمة المرور" required>
      <button type="submit" class="circle-btn">دخول</button>
    </form>
    <p id="loginMsg" class="success-message"></p>
  </div>
  <script>
    document.getElementById("loginForm").onsubmit = e => {
      e.preventDefault();
      document.getElementById("loginMsg").textContent = "✅ تم تسجيل الدخول!";
      setTimeout(() => location.href = "wallet.html", 1500);
    };
  </script>
</body>
</html>
